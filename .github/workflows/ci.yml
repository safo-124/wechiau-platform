# Runs on every push and pull request (v0.3 Phase 0, step 9).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Same major version as the laptop and the VPS. Used by integration tests.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wechiau
          POSTGRES_PASSWORD: wechiau
          POSTGRES_DB: wechiau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wechiau"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wechiau:wechiau@localhost:5432/wechiau_test?schema=public
      TEST_DATABASE_URL: postgresql://wechiau:wechiau@localhost:5432/wechiau_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install (also builds packages/shared and generates the Prisma client)
        run: npm ci
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Server end-to-end tests
        run: npm run test:e2e -w @wechiau/server
      - name: Check the database schema
        run: npx prisma validate
        working-directory: apps/server
      - name: Build server and dashboard
        run: npm run build
      - name: Bundle each phone app variant
        working-directory: apps/mobile
        run: |
          for variant in field vet farmer; do
            APP_VARIANT=$variant npx expo export --platform android --output-dir "$RUNNER_TEMP/export-$variant"
          done
